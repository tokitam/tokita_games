<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <!-- Wall -->
  <rect width="300" height="220" fill="#FFF9E6"/>
  <!-- Tile backsplash -->
  <rect x="0" y="80" width="300" height="80" fill="#E3F2FD"/>
  <line x1="0" y1="110" x2="300" y2="110" stroke="#BBDEFB" stroke-width="1"/>
  <line x1="0" y1="140" x2="300" y2="140" stroke="#BBDEFB" stroke-width="1"/>
  <line x1="60" y1="80" x2="60" y2="160" stroke="#BBDEFB" stroke-width="1"/>
  <line x1="120" y1="80" x2="120" y2="160" stroke="#BBDEFB" stroke-width="1"/>
  <line x1="180" y1="80" x2="180" y2="160" stroke="#BBDEFB" stroke-width="1"/>
  <line x1="240" y1="80" x2="240" y2="160" stroke="#BBDEFB" stroke-width="1"/>

  <!-- Counter -->
  <rect x="0" y="155" width="300" height="65" fill="#BCAAA4"/>
  <rect x="0" y="153" width="300" height="8"  fill="#D7CCC8"/>

  <!-- Window -->
  <rect x="22" y="8"  width="76" height="72" rx="4" fill="#B3E5FC" stroke="#90CAF9" stroke-width="2"/>
  <line x1="60" y1="8"  x2="60" y2="80" stroke="#90CAF9" stroke-width="2"/>
  <line x1="22" y1="44" x2="98" y2="44" stroke="#90CAF9" stroke-width="2"/>
  <!-- Sun through window -->
  <circle cx="38" cy="28" r="10" fill="#FFD700" opacity="0.7"/>

  <!-- Curtains (pink) -->
  <path d="M22,8 Q10,44 22,80" fill="#F48FB1" opacity="0.8"/>
  <path d="M98,8 Q110,44 98,80" fill="#F48FB1" opacity="0.8"/>

  <!-- Stove/pot area -->
  <rect x="160" y="140" width="80" height="15" rx="3" fill="#78909C"/>
  <!-- Pot -->
  <rect x="170" y="105" width="60" height="40" rx="6" fill="#455A64"/>
  <!-- Pot lid (with handle) -->
  <rect x="168" y="96" width="64" height="12" rx="6" fill="#546E7A"/>
  <rect x="193" y="85" width="14" height="12" rx="4" fill="#546E7A"/>

  <!-- Mug (handle on right) -->
  <rect x="70" y="100" width="44" height="50" rx="6" fill="#FFCC02"/>
  <!-- Handle on right -->
  <path d="M114,115 Q132,115 132,125 Q132,135 114,135" fill="none" stroke="#FFCC02" stroke-width="6"/>
  <!-- Steam -->
  <path d="M82,96 Q85,88 82,82" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <path d="M92,96 Q95,86 92,80" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
  <path d="M102,96 Q105,88 102,82" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>

  <!-- Apple (red) -->
  <circle cx="200" cy="132" r="16" fill="#E53935"/>
  <line x1="200" y1="116" x2="200" y2="110" stroke="#5D4037" stroke-width="2"/>
  <path d="M200,112 Q206,108 210,112" fill="none" stroke="#4CAF50" stroke-width="2"/>

  <!-- Cat (with stripes) -->
  <ellipse cx="245" cy="185" rx="22" ry="16" fill="#F5F5F5"/>
  <ellipse cx="245" cy="174" rx="14" ry="12" fill="#F5F5F5"/>
  <!-- Ears -->
  <polygon points="235,165 230,155 240,162" fill="#F5F5F5"/>
  <polygon points="255,165 260,155 250,162" fill="#F5F5F5"/>
  <polygon points="236,165 232,157 240,163" fill="#FFCCBC"/>
  <polygon points="254,165 258,157 250,163" fill="#FFCCBC"/>
  <!-- Eyes -->
  <ellipse cx="240" cy="173" rx="3" ry="4" fill="#333"/>
  <ellipse cx="250" cy="173" rx="3" ry="4" fill="#333"/>
  <!-- Nose & mouth -->
  <circle cx="245" cy="178" r="2" fill="#FF8A80"/>
  <path d="M243,180 Q245,183 247,180" fill="none" stroke="#555" stroke-width="1"/>
  <!-- Stripes (grey) -->
  <line x1="238" y1="183" x2="235" y2="193" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"/>
  <line x1="245" y1="185" x2="245" y2="197" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"/>
  <line x1="252" y1="183" x2="255" y2="193" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"/>
</svg>
