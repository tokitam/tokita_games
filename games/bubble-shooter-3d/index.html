<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>バブルシューター3D</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <canvas id="renderCanvas"></canvas>

  <!-- Title -->
  <div id="overlay-title" class="overlay">
    <div class="overlay-inner">
      <div class="big-emoji">🫧</div>
      <div class="ov-title">バブルシューター3D</div>
      <div class="ov-sub">360°のバブルを消しつくせ！</div>
      <div class="ov-hint">タップでスタート</div>
    </div>
  </div>

  <!-- Stage clear -->
  <div id="overlay-stage" class="overlay hidden">
    <div class="overlay-inner">
      <div class="big-emoji">⭐</div>
      <div class="ov-title" id="stage-title">ステージクリア！</div>
      <div class="ov-score">スコア: <span id="stage-score">0</span></div>
      <div class="ov-hint">タップでつぎへ</div>
    </div>
  </div>

  <!-- All clear -->
  <div id="overlay-clear" class="overlay hidden">
    <div class="overlay-inner">
      <div class="big-emoji">🎊</div>
      <div class="ov-title">ゲームクリア！</div>
      <div class="ov-score">スコア: <span id="clear-score">0</span></div>
      <div class="ov-best">ベスト: <span id="clear-best">0</span></div>
      <div class="ov-hint">タップでリスタート</div>
    </div>
  </div>

  <!-- Game over -->
  <div id="overlay-gameover" class="overlay hidden">
    <div class="overlay-inner">
      <div class="big-emoji">💔</div>
      <div class="ov-title">ゲームオーバー</div>
      <div class="ov-score">スコア: <span id="go-score">0</span></div>
      <div class="ov-best">ベスト: <span id="go-best">0</span></div>
      <div class="ov-hint">タップでリスタート</div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <span>ステージ <span id="stage-num">1</span>/3</span>
      <span>スコア <span id="score">0</span></span>
    </div>
    <div class="hp-bar-wrap">
      <div id="hp-bar"></div>
    </div>
  </div>

  <!-- Next bubble indicator -->
  <div id="next-bubble-wrap" class="hidden">
    <div class="next-label">つぎ</div>
    <div id="next-bubble"></div>
  </div>

  <!-- Big message -->
  <div id="big-msg" class="big-msg hidden"></div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
