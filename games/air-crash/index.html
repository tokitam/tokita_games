<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <script src="../ga.js?v=20260813" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>エアクラッシュ！</title>
  <link rel="stylesheet" href="css/style.css?v=20260814">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Overlay -->
  <div id="overlay" class="overlay">
    <div id="ov-title" class="ov-panel">
      <div class="ov-emoji">⚡</div>
      <div class="ov-title">エアクラッシュ！</div>
      <div class="ov-sub">空中で相手を壁にぶつけよう！</div>
      <div class="ov-controls">
        <div>PC: <strong>A</strong> 左上に飛ぶ &nbsp; <strong>D</strong> 右上に飛ぶ</div>
        <div>スマホ: 左タップ / 右タップ</div>
      </div>
      <div class="ov-btn" id="btn-start">タップしてスタート</div>
    </div>
    <div id="ov-result" class="ov-panel hidden">
      <div class="ov-emoji" id="res-emoji">🏆</div>
      <div class="ov-title" id="res-title">YOU WIN!</div>
      <div class="ov-sub" id="res-sub"></div>
      <div class="ov-btn" id="btn-retry">もう一度</div>
    </div>
  </div>

  <!-- Touch guides -->
  <div id="touch-left"  class="touch-guide tg-left">◀ 左上</div>
  <div id="touch-right" class="touch-guide tg-right">右上 ▶</div>

  <script src="js/sound.js?v=20260814"></script>
  <script src="js/game.js?v=20260814"></script>
  <script src="js/main.js?v=20260814"></script>
</body>
</html>
